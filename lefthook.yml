# Runs the full check suite before every commit so nothing broken gets pushed.
# Biome only sees the staged files it cares about; the test suite always runs
# (a config change can break tests without touching a test file).
pre-commit:
  parallel: true
  jobs:
    - name: biome
      glob: "*.{js,jsx,ts,tsx,json,jsonc,css}"
      run: npx biome check --write {staged_files}
      stage_fixed: true
    - name: test
      run: npm run test:coverage
